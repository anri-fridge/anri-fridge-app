<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f8f6f2"><title>ANRI FRIDGE</title><style>
:root{--bg:#f8f6f2;--paper:#fff;--ink:#353c37;--muted:#818981;--green:#547968;--light:#eaf0e9;--line:#e8e7e1;--red:#b76b5c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif;font-size:15px}button,input,select{font:inherit}button{cursor:pointer}header{padding:24px 18px 14px;max-width:760px;margin:auto}.eyebrow{letter-spacing:.2em;color:var(--green);font-size:10px;font-weight:700}h1{font-family:Georgia,serif;letter-spacing:.09em;font-size:30px;margin:5px 0}.sub{color:var(--muted);font-size:12px}main{max-width:760px;margin:auto;padding:0 14px 95px}.panel{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:13px;box-shadow:0 3px 14px #293e3010}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.title{font-weight:700;font-size:17px}.small{font-size:12px;color:var(--muted)}.btn{border:0;border-radius:11px;padding:10px 13px;background:var(--green);color:white;font-weight:650}.btn.secondary{background:var(--light);color:var(--green)}.btn.ghost{background:#f5f5f2;color:var(--ink)}.btn.danger{background:#f9e9e5;color:var(--red)}.btn:disabled{opacity:.45}.mini{padding:7px 10px;font-size:12px}.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;background:#fff;border-top:1px solid var(--line);padding:9px 8px calc(10px + env(safe-area-inset-bottom));z-index:10}.tabs button{width:min(33%,240px);background:none;border:0;color:var(--muted);padding:6px;font-size:12px}.tabs button.active{color:var(--green);font-weight:800}.tabs b{display:block;font-size:20px;margin-bottom:2px}.pillbar{display:flex;gap:7px;overflow:auto;padding:4px 0 12px}.pill{white-space:nowrap;background:#f5f5f2;border:1px solid var(--line);border-radius:30px;padding:8px 12px;color:var(--ink)}.pill.active{background:var(--light);color:var(--green);border-color:#a9c1b2;font-weight:700}.item{padding:12px 0;border-bottom:1px solid var(--line)}.item:last-child{border-bottom:0}.name{font-weight:650}.qty{color:var(--green);font-weight:750}.actions{display:flex;gap:5px;flex-wrap:wrap}.empty{text-align:center;padding:36px 10px;color:var(--muted);line-height:1.8}.field{display:flex;flex-direction:column;gap:5px;margin:9px 0}.field label{font-size:12px;color:var(--muted);font-weight:700}input,select{border:1px solid #dcded7;border-radius:10px;background:white;padding:11px;width:100%;min-width:0;color:var(--ink)}input[type=checkbox]{width:21px;height:21px;accent-color:var(--green)}.two{display:grid;grid-template-columns:1fr 1fr;gap:9px}.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.chipwrap{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0}.chip{border:1px solid var(--line);border-radius:9px;background:#f9f9f7;padding:9px 11px}.chip.active{background:var(--light);border-color:var(--green);color:var(--green);font-weight:700}.divider{height:1px;background:var(--line);margin:14px 0}.count{background:var(--light);color:var(--green);border-radius:99px;padding:5px 10px;font-size:12px;font-weight:700}.hidden{display:none!important}.note{font-size:12px;color:var(--muted);line-height:1.65}.stack{display:flex;flex-direction:column;gap:8px}.notice{background:#f0f3ed;border-radius:12px;padding:11px;font-size:12px;color:#526c5a}.toast{position:fixed;bottom:87px;left:50%;transform:translateX(-50%);background:#344d40;color:white;padding:11px 17px;border-radius:25px;z-index:30;font-size:13px;box-shadow:0 5px 20px #0002;max-width:90%;text-align:center}dialog{border:0;border-radius:18px;padding:20px;width:min(92vw,460px);box-shadow:0 12px 45px #0003}dialog::backdrop{background:#0005}dialog h2{margin-top:0;font-size:19px}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 8px;text-align:center}.stat strong{display:block;font-size:23px;color:var(--green)}.stat span{font-size:11px;color:var(--muted)}.checkrow{display:flex;gap:12px;align-items:center;flex:1}.done{text-decoration:line-through;color:#9da29c}.search{margin:10px 0}.wide{width:100%}.sectionlabel{font-weight:700;font-size:13px;margin:14px 0 8px}.selectedline{display:grid;grid-template-columns:1fr 100px 85px 30px;gap:6px;align-items:center;margin:7px 0}.selectedline input,.selectedline select{padding:8px}.selectedline .btn{padding:7px 0}.footnote{font-size:11px;color:var(--muted);margin:10px 3px;line-height:1.7}@media(max-width:380px){.selectedline{grid-template-columns:1fr 72px 70px 28px}.selectedline input,.selectedline select{font-size:13px}}
.foodchip{display:inline-flex;align-items:center;gap:2px}.foodchip .chip{border-radius:9px 0 0 9px}.removefood{border:1px solid #e5c8c1;background:#f9e9e5;color:#a55e50;border-radius:0 9px 9px 0;padding:9px 10px;font-weight:800;min-height:39px}</style></head><body><header><div class="eyebrow">ANRI LIFE SERIES · FOOD INVENTORY</div><h1>ANRI FRIDGE <span style="font-family:sans-serif;font-size:23px">❄</span></h1><div class="sub">わが家の食材を、すっきり管理。</div></header><main><div id="view"></div></main><nav class="tabs"><button data-tab="stock" class="active"><b>▤</b>在庫を見る</button><button data-tab="add"><b>＋</b>まとめて登録</button><button data-tab="shopping"><b>☑</b>買い物リスト</button></nav><dialog id="dlg"><h2 id="dlgtitle"></h2><div id="dlgbody"></div><div class="row" style="margin-top:15px"><button class="btn ghost" onclick="dlg.close()">閉じる</button><button class="btn" id="dlgok">保存</button></div></dialog><input id="importFile" type="file" accept=".json,application/json" hidden><script>
'use strict';const dlg=document.getElementById('dlg');const KEY='anri_fridge_v1';const PLACES=['冷蔵庫','野菜室','冷凍庫','常温・乾物'];const CATEGORIES={野菜:['人参','大根','キャベツ','小松菜','白菜','玉ねぎ','じゃがいも','きゅうり','トマト','ピーマン','なす','ブロッコリー','ほうれん草','レタス','長ねぎ','もやし','かぼちゃ','冬瓜','きのこ','えのき','しめじ','エリンギ'],肉・魚:['豚こま','豚バラ','鶏もも肉','鶏むね肉','ひき肉','牛肉','ウインナー','ハム','ベーコン','鮭','さば','いか','えび'],乳製品・その他:['卵','牛乳','豆腐','納豆','ヨーグルト','チーズ','キムチ','バター','こんにゃく','ちくわ','油揚げ'],乾物・調味料:['ツナ缶','乾麺','パスタ','押し麦','米','小麦粉','片栗粉','パン粉','海苔','わかめ','ごま','しょうゆ','みそ','マヨネーズ','ケチャップ','砂糖','塩','油']};const DEFAULTS={人参:['本','野菜室'],大根:['本','野菜室'],キャベツ:['玉','野菜室'],小松菜:['束','野菜室'],白菜:['玉','野菜室'],玉ねぎ:['個','常温・乾物'],じゃがいも:['個','常温・乾物'],きゅうり:['本','野菜室'],卵:['個','冷蔵庫'],豆腐:['丁','冷蔵庫'],納豆:['パック','冷蔵庫'],牛乳:['本','冷蔵庫'],豚こま:['g','冷凍庫'],鶏もも肉:['g','冷凍庫'],ツナ缶:['缶','常温・乾物'],乾麺:['袋','常温・乾物']};const UNITS=['本','個','玉','束','袋','パック','丁','g','kg','枚','缶','瓶','箱','房','株','切れ','尾','L','ml'];const fmt=n=>{n=Number(n);if(!Number.isFinite(n))return '0';const whole=Math.floor(n+1e-8),r=n-whole;const fractions=[[.25,'1/4'],[.5,'1/2'],[.75,'3/4'],[1/3,'1/3'],[2/3,'2/3']];const f=fractions.find(x=>Math.abs(r-x[0])<.008);return f?(whole?whole+'と':'')+f[1]:String(Number(n.toFixed(3)))};const num=v=>{let s=String(v??'').trim().replace(/１/g,'1').replace(/２/g,'2').replace(/３/g,'3').replace(/４/g,'4').replace(/／/g,'/');if(s.includes('と')){let p=s.split('と');return Number(p[0])+num(p[1])}if(s.includes('/')){let p=s.split('/');return Number(p[0])/Number(p[1])}return Number(s)};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);function read(){try{let x=JSON.parse(localStorage.getItem(KEY));if(x&&Array.isArray(x.stock)&&Array.isArray(x.shopping))return x}catch(e){}return {stock:[],shopping:[],customFoods:[]}}let db=read();if(!Array.isArray(db.customFoods))db.customFoods=[];let tab='stock',place='すべて',cat='野菜',chosen=[],extra=[],filter='',shoppingInput='',draft={};const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(db));return true}catch(e){toast('保存できません。空き容量を確認してください');return false}};function toast(s){document.querySelector('.toast')?.remove();let e=document.createElement('div');e.className='toast';e.textContent=s;document.body.append(e);setTimeout(()=>e.remove(),2300)}const button=(label,act,cls='secondary mini')=>`<button class="btn ${cls}" data-act="${act}">${label}</button>`;const opts=(arr,val)=>arr.map(x=>`<option value="${esc(x)}" ${x===val?'selected':''}>${esc(x)}</option>`).join('');const base=(name)=>DEFAULTS[name]||[(['肉・魚'].some(k=>CATEGORIES[k].includes(name))?'g':'個'),(['乾物・調味料'].some(k=>CATEGORIES[k].includes(name))?'常温・乾物':'冷蔵庫')];function render(){document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));document.getElementById('view').innerHTML=tab==='stock'?stockView():tab==='add'?addView():shoppingView()}
function stockView(){let filtered=db.stock.filter(x=>place==='すべて'||x.place===place).filter(x=>x.name.includes(filter));let groups=place==='すべて'?PLACES:[place];let out=`<div class="summary"><div class="stat"><strong>${db.stock.length}</strong><span>登録食材</span></div><div class="stat"><strong>${db.stock.filter(x=>x.place==='野菜室').length}</strong><span>野菜室</span></div><div class="stat"><strong>${db.shopping.filter(x=>!x.done).length}</strong><span>買うもの</span></div></div><div class="panel"><div class="row"><span class="title">わが家の在庫</span>${button('⚙ 設定・バックアップ','settings')}</div><input class="search" id="stockSearch" placeholder="食材を検索" value="${esc(filter)}"><div class="pillbar">${['すべて',...PLACES].map(p=>`<button class="pill ${place===p?'active':''}" data-place="${esc(p)}">${esc(p)}</button>`).join('')}</div>`;if(!filtered.length)out+=`<div class="empty">まだ食材がありません。<br>「まとめて登録」から追加しよう 🥕</div>`;else groups.forEach(g=>{let arr=filtered.filter(x=>x.place===g);if(!arr.length)return;out+=`<div class="sectionlabel">${esc(g)} <span class="small">${arr.length}品</span></div>`;arr.forEach(x=>out+=`<div class="item"><div class="row"><div><div class="name">${esc(x.name)}</div><div class="qty">${fmt(x.qty)}${esc(x.unit)}</div></div><div class="actions">${button('－','minus:'+x.id)}${button('＋','plus:'+x.id)}${button('編集','edit:'+x.id,'ghost mini')}${button('買う','buy:'+x.id,'secondary mini')}</div></div></div>`)});return out+`</div><div class="footnote">数量の「－」「＋」は通常1単位ずつ変更します。半分など細かい変更は「編集」から。</div>`}
function addView(){let names=[...new Set([...CATEGORIES[cat],...db.customFoods.filter(x=>x.category===cat).map(x=>x.name)])];return `<div class="panel"><div class="row"><span class="title">食材をまとめて登録</span><span class="count">${chosen.length}品選択中</span></div><div class="pillbar" style="margin-top:12px">${Object.keys(CATEGORIES).map(c=>`<button class="pill ${cat===c?'active':''}" data-cat="${esc(c)}">${esc(c)}</button>`).join('')}</div><div class="chipwrap">${names.map(n=>`<span class="foodchip"><button class="chip ${chosen.includes(n)?'active':''}" data-food="${esc(n)}">${chosen.includes(n)?'✓ ':''}${esc(n)}</button>${db.customFoods.some(x=>x.name===n&&x.category===cat)?`<button class="removefood" data-act="removefood:${encodeURIComponent(n)}" aria-label="${esc(n)}を候補から削除">×</button>`:''}</span>`).join('')}</div><p class="note">自分で追加した食材は、右側の「×」から候補だけ削除できます。在庫は消えません。</p><div class="row"><input id="newFood" placeholder="一覧にない食材名を入力">${button('追加','custom','secondary')}</div>${chosen.length?`<div class="divider"></div><div class="sectionlabel">数量を入力</div><p class="note">1/2や1/4も入力できます。保存場所は食材ごとに選択できます。</p>${chosen.map(n=>{let d=draft[n]||{qty:'1',unit:base(n)[0],place:base(n)[1]};return `<div class="panel" style="padding:11px;margin:8px 0;background:#fafbf9"><div class="row"><strong>${esc(n)}</strong>${button('×','unchoose:'+encodeURIComponent(n),'ghost mini')}</div><div class="three"><div class="field"><label>数量</label><input data-draft="qty" data-name="${esc(n)}" value="${esc(d.qty)}" inputmode="decimal"></div><div class="field"><label>単位</label><select data-draft="unit" data-name="${esc(n)}">${opts(UNITS,d.unit)}</select></div><div class="field"><label>保存場所</label><select data-draft="place" data-name="${esc(n)}">${opts(PLACES,d.place)}</select></div></div></div>`}).join('')}<button class="btn wide" data-act="commit">${chosen.length}品をまとめて在庫に登録</button>`:`<div class="empty">買ってきた食材をタップして選ぼう ✨</div>`}</div><div class="note">同じ食材・単位・保存場所の在庫があれば、数量を合算します。</div>`}
function shoppingView(){let remaining=db.shopping.filter(x=>!x.done).length;return `<div class="panel"><div class="row"><span class="title">お買い物リスト</span><span class="count">あと${remaining}品</span></div><p class="note">必要な食材を追加。買ったものにチェックを入れたら、帰宅後に在庫へ反映できます。</p><div class="row"><input id="shoppingName" placeholder="例：納豆" value="${esc(shoppingInput)}">${button('追加','shopadd','secondary')}</div>${db.shopping.length?db.shopping.map(x=>`<div class="item"><div class="row"><label class="checkrow"><input type="checkbox" data-check="${x.id}" ${x.done?'checked':''}><span class="${x.done?'done':''}">${esc(x.name)} <span class="small">${fmt(x.qty)}${esc(x.unit)}</span></span></label><div class="actions">${button('編集','shopedit:'+x.id,'ghost mini')}${button('×','shopdelete:'+x.id,'ghost mini')}</div></div></div>`).join(''):`<div class="empty">リストは空です 🛒<br>在庫画面の「買う」からも追加できます。</div>`}${db.shopping.some(x=>x.done)?`<div class="divider"></div><button class="btn wide" data-act="transfer">✓ チェックした食材を在庫へ反映</button><p class="note">反映する前に、数量・単位・保存場所を確認できます。</p>`:''}</div>`}
function changeTab(t){tab=t;render();scrollTo(0,0)}document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>changeTab(b.dataset.tab));function ensureDraft(n){if(!draft[n])draft[n]={qty:'1',unit:base(n)[0],place:base(n)[1]}}function addShop(name,qty=1,unit,loc){let d=base(name);let match=db.shopping.find(x=>x.name===name&&!x.done&&x.unit===(unit||d[0]));if(match)match.qty+=qty;else db.shopping.push({id:uid(),name,qty,unit:unit||d[0],place:loc||d[1],done:false});save();toast('買い物リストに追加しました')}
function modal(title,body,ok){document.getElementById('dlgtitle').textContent=title;document.getElementById('dlgbody').innerHTML=body;document.getElementById('dlgok').onclick=ok;dlg.showModal()}const editFields=(x,prefix='m')=>`<div class="field"><label>食材名</label><input id="${prefix}name" value="${esc(x.name)}"></div><div class="two"><div class="field"><label>数量（例：1/2）</label><input id="${prefix}qty" value="${fmt(x.qty)}"></div><div class="field"><label>単位</label><select id="${prefix}unit">${opts(UNITS,x.unit)}</select></div></div><div class="field"><label>保存場所</label><select id="${prefix}place">${opts(PLACES,x.place)}</select></div>`;function getFields(prefix='m'){let name=document.getElementById(prefix+'name').value.trim(),qty=num(document.getElementById(prefix+'qty').value),unit=document.getElementById(prefix+'unit').value,place=document.getElementById(prefix+'place').value;if(!name||!Number.isFinite(qty)||qty<=0){toast('食材名と0より大きい数量を入力してください');return null}return {name,qty,unit,place}}function mergeStock(x){let old=db.stock.find(a=>a.name===x.name&&a.unit===x.unit&&a.place===x.place);if(old)old.qty=Number((old.qty+x.qty).toFixed(4));else db.stock.push({...x,id:uid()})}
function handleAct(a){if(a==='settings'){modal('設定・バックアップ',`<div class="stack"><button class="btn secondary" id="export">バックアップを書き出す（JSON）</button><button class="btn secondary" id="import">バックアップを読み込む</button><button class="btn danger" id="clear">全データを削除</button><p class="note">データはこのブラウザ内に保存されます。iPhoneのブラウザデータ削除・端末変更などで消える場合があるため、定期的にバックアップしてください。バックアップには在庫・買い物リスト・追加した食材候補が含まれます。</p></div>`,()=>dlg.close());document.getElementById('dlgok').style.display='none';document.getElementById('export').onclick=()=>{let blob=new Blob([JSON.stringify({app:'ANRI FRIDGE',version:1,exportedAt:new Date().toISOString(),...db},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='ANRI_FRIDGE_backup_'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1500)};document.getElementById('import').onclick=()=>document.getElementById('importFile').click();document.getElementById('clear').onclick=()=>{if(confirm('在庫と買い物リストをすべて削除します。元に戻せません。よろしいですか？')&&confirm('本当に全データを削除しますか？')){db={stock:[],shopping:[],customFoods:[]};save();dlg.close();render()}};return}document.getElementById('dlgok').style.display='';if(a==='custom'){let n=document.getElementById('newFood').value.trim();if(!n)return;if(!Object.values(CATEGORIES).flat().includes(n)&&!db.customFoods.some(x=>x.name===n&&x.category===cat)){db.customFoods.push({name:n,category:cat});save()}if(!chosen.includes(n))chosen.push(n);ensureDraft(n);render();return}if(a.startsWith('removefood:')){let n=decodeURIComponent(a.slice(11));if(!confirm('「'+n+'」をこの候補一覧から削除しますか？\n※登録済みの在庫や買い物リストは消えません。'))return;db.customFoods=db.customFoods.filter(x=>!(x.name===n&&x.category===cat));chosen=chosen.filter(x=>x!==n);delete draft[n];save();render();toast('候補から削除しました');return}if(a.startsWith('unchoose:')){let n=decodeURIComponent(a.slice(9));chosen=chosen.filter(x=>x!==n);render();return}if(a==='commit'){let batch=[];for(let n of chosen){let d=draft[n];let q=num(d.qty);if(!Number.isFinite(q)||q<=0){toast(n+'の数量を確認してください');return}batch.push({name:n,qty:q,unit:d.unit,place:d.place})}batch.forEach(mergeStock);if(save()){chosen=[];draft={};changeTab('stock');toast(batch.length+'品を登録しました')}return}if(a==='shopadd'){let n=document.getElementById('shoppingName').value.trim();if(!n)return;addShop(n);shoppingInput='';render();return}if(a==='transfer'){let done=db.shopping.filter(x=>x.done);let rows=done.map((x,i)=>`<div class="panel" style="padding:10px;background:#fafbf9"><strong>${esc(x.name)}</strong><div class="three"><div class="field"><label>数量</label><input id="tq${i}" value="${fmt(x.qty)}"></div><div class="field"><label>単位</label><select id="tu${i}">${opts(UNITS,x.unit)}</select></div><div class="field"><label>保存場所</label><select id="tp${i}">${opts(PLACES,x.place)}</select></div></div></div>`).join('');modal('購入品を在庫へ反映',`<p class="note">実際に購入した数量に修正してから保存してください。</p>${rows}`,()=>{let arr=[];for(let i=0;i<done.length;i++){let qty=num(document.getElementById('tq'+i).value);if(!Number.isFinite(qty)||qty<=0){toast('数量を確認してください');return}arr.push({name:done[i].name,qty,unit:document.getElementById('tu'+i).value,place:document.getElementById('tp'+i).value})}arr.forEach(mergeStock);db.shopping=db.shopping.filter(x=>!x.done);if(save()){dlg.close();render();toast(arr.length+'品を在庫へ反映しました')}});return}let [kind,id]=a.split(':');if(kind==='edit'){let x=db.stock.find(x=>x.id===id);if(!x)return;modal('在庫を編集',editFields(x)+`<button class="btn danger mini" id="deleteItem">この食材を削除</button>`,()=>{let y=getFields();if(!y)return;db.stock=db.stock.filter(v=>v.id!==id);mergeStock(y);if(save()){dlg.close();render();toast('更新しました')}});document.getElementById('deleteItem').onclick=()=>{if(confirm(x.name+'を在庫から削除しますか？')){db.stock=db.stock.filter(v=>v.id!==id);save();dlg.close();render()}};return}if(kind==='minus'||kind==='plus'){let x=db.stock.find(x=>x.id===id);if(!x)return;let step=x.unit==='g'?50:x.unit==='kg'?0.1:x.unit==='ml'?100:x.unit==='L'?0.1:1;let next=Number((x.qty+(kind==='plus'?step:-step)).toFixed(3));if(next<=0){if(!confirm(x.name+'を使い切ったものとして在庫から削除しますか？'))return;db.stock=db.stock.filter(v=>v.id!==id)}else x.qty=next;save();render();return}if(kind==='buy'){let x=db.stock.find(x=>x.id===id);if(x)addShop(x.name,1,x.unit,x.place);return}if(kind==='shopdelete'){db.shopping=db.shopping.filter(x=>x.id!==id);save();render();return}if(kind==='shopedit'){let x=db.shopping.find(x=>x.id===id);if(!x)return;modal('買い物メモを編集',editFields(x),()=>{let y=getFields();if(!y)return;Object.assign(x,y);save();dlg.close();render()});return}}
document.getElementById('view').addEventListener('click',e=>{let b=e.target.closest('[data-act],[data-place],[data-cat],[data-food]');if(!b)return;if(b.dataset.act){handleAct(b.dataset.act);return}if(b.dataset.place){place=b.dataset.place;render();return}if(b.dataset.cat){cat=b.dataset.cat;render();return}if(b.dataset.food){let n=b.dataset.food;if(chosen.includes(n))chosen=chosen.filter(x=>x!==n);else{chosen.push(n);ensureDraft(n)}render()}});document.getElementById('view').addEventListener('input',e=>{if(e.target.dataset.draft){ensureDraft(e.target.dataset.name);draft[e.target.dataset.name][e.target.dataset.draft]=e.target.value}else if(e.target.id==='stockSearch'){filter=e.target.value;let pos=e.target.selectionStart;render();let el=document.getElementById('stockSearch');el.focus();el.setSelectionRange(pos,pos)}else if(e.target.id==='shoppingName')shoppingInput=e.target.value});document.getElementById('view').addEventListener('change',e=>{if(e.target.dataset.draft){ensureDraft(e.target.dataset.name);draft[e.target.dataset.name][e.target.dataset.draft]=e.target.value}if(e.target.dataset.check){let x=db.shopping.find(x=>x.id===e.target.dataset.check);if(x){x.done=e.target.checked;save();render()}}});document.getElementById('importFile').addEventListener('change',async e=>{let f=e.target.files[0];if(!f)return;try{let x=JSON.parse(await f.text());if(!Array.isArray(x.stock)||!Array.isArray(x.shopping))throw Error('形式が違います');const validStock=x.stock.every(a=>typeof a.name==='string'&&Number.isFinite(a.qty)&&a.qty>0&&UNITS.includes(a.unit)&&PLACES.includes(a.place));const validShop=x.shopping.every(a=>typeof a.name==='string'&&Number.isFinite(a.qty)&&a.qty>0&&UNITS.includes(a.unit)&&PLACES.includes(a.place));if(!validStock||!validShop)throw Error('内容が不正です');if(confirm('現在の在庫と買い物リストをバックアップの内容で置き換えますか？')){db={stock:x.stock.map(a=>({...a,id:uid()})),shopping:x.shopping.map(a=>({...a,id:uid(),done:!!a.done})),customFoods:Array.isArray(x.customFoods)?x.customFoods.filter(a=>a&&typeof a.name==='string'&&Object.hasOwn(CATEGORIES,a.category)):[]};save();dlg.close();render();toast('復元しました')}}catch(err){alert('読み込めませんでした：'+err.message)}e.target.value=''});render();</script></body></html>
